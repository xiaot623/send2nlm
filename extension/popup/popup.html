<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send2NLM</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <div id="backBar" class="back-bar hidden">
        <button id="backButton" class="ghost" type="button" data-i18n="backButton"></button>
      </div>

      <div id="statusBanner" class="status-banner hidden"></div>

      <div class="pages-shell">
        <div id="pages" class="pages" data-page="0">
          <section class="page" id="page-notebooks">
            <div class="section-header">
              <div class="section-title" data-i18n="selectNotebook"></div>
              <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
              </button>
            </div>
            <form id="createNotebookForm" class="create-form">
              <input id="emojiInput" maxlength="2" value="📒" aria-label="emoji" />
              <input id="titleInput" placeholder="Notebook title" />
              <button type="submit" data-i18n="createNotebook"></button>
            </form>
            <div id="notebookList" class="notebook-list"></div>
          </section>

          <section class="page" id="page-send">
            <div class="detail-card">
              <div class="label">Notebook</div>
              <div id="selectedNotebookTitle" class="value"></div>
            </div>
            <div class="detail-card">
              <div class="label">Page</div>
              <div id="pageUrlPreview" class="url-preview"></div>
            </div>
            <div class="options">
              <label><input id="audioTask" type="checkbox" checked /> <span data-i18n="audioOverview"></span></label>
              <label><input id="slidesTask" type="checkbox" /> <span data-i18n="slideDeck"></span></label>
              <label><input id="videoTask" type="checkbox" /> <span data-i18n="videoOverview"></span></label>
            </div>
            <button id="sendButton" class="primary" type="button" data-i18n="sendButton"></button>
          </section>

          <section class="page" id="page-result">
            <div id="resultNotebook" class="detail-card"></div>
            <div id="resultUrl" class="detail-card url-preview"></div>
            <div id="resultSteps" class="result-steps"></div>
            <a id="viewNotebookLink" class="link-button hidden" target="_blank" rel="noreferrer" data-i18n="viewInNotebookLM"></a>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
  </html>

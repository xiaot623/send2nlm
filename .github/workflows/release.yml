name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Matches your daemon go.mod version

      - name: Build Go binaries
        run: |
          mkdir -p dist
          cd daemon
          # Linux
          GOOS=linux GOARCH=amd64 go build -o ../dist/send2nlm-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o ../dist/send2nlm-linux-arm64 .
          # macOS
          GOOS=darwin GOARCH=amd64 go build -o ../dist/send2nlm-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o ../dist/send2nlm-darwin-arm64 .
          # Windows
          GOOS=windows GOARCH=amd64 go build -o ../dist/send2nlm-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o ../dist/send2nlm-windows-arm64.exe .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
